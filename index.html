<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4eee3">
  <meta name="description" content="A little birthday storybook made for a friend across the miles.">
  <meta name="robots" content="noindex,nofollow">
  <title>The Pages Between Us · For Ash</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8">
  <script src="config.js" defer></script>
  <script src="script.js?v=8" defer></script>
</head>
<body>
  <main class="storybook-app" id="app">
    <header class="masthead">
      <div class="masthead-name"><span aria-hidden="true">✦</span><span>the pages between us</span></div>
      <div class="masthead-date">FOR <span data-recipient>Ash</span> · 07 NOV</div>
    </header>

    <div class="book-area">
      <div class="book-backdrop backdrop-a" aria-hidden="true">✳</div>
      <div class="book-backdrop backdrop-b" aria-hidden="true">❀</div>
      <div class="book-shell is-closed" id="book" aria-label="Interactive birthday storybook">
        <div class="book-edge" aria-hidden="true"></div>
        <div class="paper-surface" aria-hidden="true"></div>

        <div class="book-page book-left" id="page-left" aria-hidden="true"></div>
        <div class="book-page book-right" id="page-right" aria-hidden="true"></div>
        <div class="book-gutter" aria-hidden="true"></div>
        <div class="turn-leaf" id="turn-leaf" aria-hidden="true">
          <div class="turn-leaf-face leaf-front" id="leaf-front"></div>
          <div class="turn-leaf-face leaf-back" id="leaf-back"></div>
        </div>

        <button class="book-cover" id="book-cover" type="button" aria-label="Open the birthday storybook">
          <span class="cover-face cover-outside">
            <span class="cover-inner-border">
              <span class="cover-flourish cover-top" aria-hidden="true">✧ · ❀ · ✧</span>
              <span class="cover-middle">
                <span class="cover-kicker">A BIRTHDAY STORY</span>
                <span class="cover-small-line" aria-hidden="true"></span>
                <span class="cover-title">the pages<br><i>between</i><br>us</span>
                <span class="cover-small-line" aria-hidden="true"></span>
                <span class="cover-for">FOR <span data-recipient>Ash</span> · NOVEMBER SEVENTH</span>
              </span>
              <span class="cover-flourish cover-bottom" aria-hidden="true">❦</span>
            </span>
            <span class="cover-click-hint">tap this cover to open <span aria-hidden="true">✧</span></span>
          </span>
          <span class="cover-face cover-inside" aria-hidden="true"><span>for the stories<br>still to come ♡</span></span>
        </button>
      </div>
    </div>

    <nav class="book-controls" aria-label="Book navigation">
      <button type="button" class="nav-arrow" id="previous-page" disabled aria-label="Previous page"><span aria-hidden="true">←</span><span class="nav-text">Previous</span></button>
      <div class="book-progress">
        <div class="progress-label" id="progress-label" aria-live="polite">A story for you</div>
        <div class="progress-dots" id="progress-dots" aria-hidden="true"></div>
      </div>
      <button type="button" class="nav-arrow nav-next" id="next-page" disabled aria-label="Next page"><span class="nav-text">Next page</span><span aria-hidden="true">→</span></button>
    </nav>
    <p class="book-instructions" id="book-instructions">Start by tapping the book. Then use the page arrows or swipe to read.</p>
  </main>

  <template id="page-intro">
    <div class="page-content page-intro">
      <div class="folio-label">A LETTER IN THE FORM OF A BOOK</div>
      <div class="intro-illustration" aria-hidden="true"><span>✿</span><span>❦</span><span>✧</span></div>
      <div class="intro-text">
        <p class="page-eyebrow">a little birthday surprise</p>
        <h1>Some stories<br>are better <em>shared.</em></h1>
        <p>This one began with words on a screen, found its way across the miles, and somehow kept going.</p>
        <p class="intro-dedication">A little something for <strong data-recipient>Ash</strong> ♡</p>
      </div>
      <div class="intro-bottom">TAKE YOUR TIME · EVERY PAGE HAS SOMETHING TO SAY</div>
    </div>
  </template>

  <template id="page-origin">
    <div class="page-content page-origin">
      <div class="folio-label">CHAPTER ONE · THE BEGINNING</div>
      <h2>It started with<br><em>a story.</em></h2>
      <div class="wattpad-note" aria-hidden="true">
        <span class="wattpad-mark">W</span>
        <span class="wattpad-lines"><i></i><i></i><i></i></span>
        <span class="wattpad-note-caption">a rather unexpected beginning ✧</span>
      </div>
      <p>Once upon a Wattpad, two people happened to cross paths somewhere between stories, messages, and the internet being the internet.</p>
      <p>Funny how a place for fictional worlds can lead to a very real friendship.</p>
      <p class="page-aside">Plot twist: the conversations continued.</p>
    </div>
  </template>

  <template id="page-notes">
    <div class="page-content page-notes">
      <div class="folio-label">CHAPTER TWO · FAMILIAR CHAOS</div>
      <h2>Little things<br><em>we'd recognize.</em></h2>
      <p class="page-lead">A tiny archive of recurring nonsense. Tap a note to reveal what is inside.</p>
      <div class="memory-grid" data-memory-grid aria-label="Four interactive inside jokes"></div>
      <p class="page-aside">Some context is strictly between us. And some context probably never existed.</p>
    </div>
  </template>

  <template id="page-distance">
    <div class="page-content page-distance">
      <div class="folio-label">CHAPTER THREE · ACROSS THE MILES</div>
      <h2>Different clocks.<br><em>Same conversation.</em></h2>
      <div class="sky-postcard" aria-hidden="true"><span class="sky-sun"></span><span class="sky-moon"></span><span class="sky-spark a">✦</span><span class="sky-spark b">✧</span><span class="sky-spark c">✦</span><span class="sky-text">same sky, different hours</span></div>
      <div class="time-cards">
        <div class="time-card"><small>PHILIPPINES</small><strong data-clock="ph">--:--</strong></div>
        <span class="time-connection" aria-hidden="true">↔</span>
        <div class="time-card"><small data-friend-location>ITALY</small><strong data-clock="it">--:--</strong></div>
      </div>
      <p>There are classes, workdays, busy weeks, and the occasional message answered at an unreasonable hour.</p>
      <p class="page-aside">Time zones really chose violence.</p>
    </div>
  </template>

  <template id="page-letter">
    <div class="page-content page-letter">
      <div class="folio-label">CHAPTER FOUR · A FEW WORDS</div>
      <h2>Something<br><em>for you to read.</em></h2>
      <p class="page-lead">Some things deserve more than a passing notification.</p>
      <div class="letter-world" data-letter-world>
        <div class="letter-envelope" data-letter-envelope aria-hidden="true">
          <div class="env-back"></div>
          <div class="env-flap"></div>
          <div class="env-front"></div>
          <div class="env-stamp">♡</div>
        </div>
        <div class="letter-sheet" data-letter-sheet role="button" tabindex="-1" aria-label="Tap letter to fold it into the envelope" aria-hidden="true">
          <div class="sheet-inner">
            <small>November 7, <span data-year>2026</span></small>
            <h3>Dear <span data-recipient>Ash</span>,</h3>
            <div data-letter-paragraphs class="letter-prose"></div>
            <p class="letter-signoff">With appreciation,<br><strong data-sender>Your friend</strong></p>
          </div>
        </div>
        <button class="letter-tap-zone" data-letter-toggle type="button" aria-label="Open the birthday letter"><span aria-hidden="true">♡</span><span data-letter-label>Tap the envelope to open</span></button>
      </div>
      <p class="page-aside letter-aside">Once it's open, tap the paper again to put it back.</p>
    </div>
  </template>

  <template id="page-birthday">
    <div class="page-content page-birthday">
      <div class="folio-label">THE EPILOGUE · NOVEMBER SEVENTH</div>
      <h2>The most<br><em>important chapter.</em></h2>
      <p class="page-lead">Happy birthday, <strong data-recipient>Ash</strong>! There's a tiny cake, naturally.</p>
      <div class="cake-scene" data-cake-scene role="img" aria-label="Birthday cake with three flickering candles">
        <div class="cake-shimmer" aria-hidden="true">✧ <span>✦</span> ✧</div>
        <div class="cake-candles" aria-hidden="true"><span class="candle"><i class="flame"></i><i class="smoke"></i></span><span class="candle"><i class="flame"></i><i class="smoke"></i></span><span class="candle"><i class="flame"></i><i class="smoke"></i></span></div>
        <div class="cake-icing"></div><div class="cake-base"><span>make a wish ♡</span></div><div class="cake-plate"></div>
        <div class="cake-confetti" data-confetti aria-hidden="true"></div>
      </div>
      <button class="wish-button" type="button" data-wish-button>Make a wish &amp; blow out the candles ✳</button>
      <p class="birthday-wish" data-birthday-wish aria-live="polite" hidden></p>
      <div class="mystery-note"><span>One more entirely trustworthy gift</span><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">open the mystery ↗</a><small>Some traditions can't be abandoned.</small></div>
    </div>
  </template>

  <template id="page-ending">
    <div class="page-content page-ending">
      <span class="ending-ornament" aria-hidden="true">✧ ❀ ✧</span>
      <div class="ending-core"><p class="page-eyebrow">a small final note</p><h2>To be<br><em>continued.</em></h2><p>For the conversations still waiting to happen.</p><p class="ending-signature">with appreciation, <span data-sender>Your friend</span> ♡</p></div>
      <div class="ending-action"><button type="button" data-restart>Read from the beginning ↺</button></div>
    </div>
  </template>

  <template id="page-blank">
    <div class="page-content page-blank"><span class="blank-ornament">❦</span><span>fin.</span></div>
  </template>
</body>
</html>
