<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152439">
  <meta name="description" content="An interactive birthday storybook for a friend across the miles.">
  <meta name="robots" content="noindex,nofollow">
  <title>The Pages Between Us · A Birthday Story</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=12">
  <link rel="stylesheet" href="storybook-extras.css?v=12">
  <!-- MIT-licensed StPageFlip 2.0.7, pinned to one version. -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js" defer></script>
  <script src="config.js?v=13" defer></script>
  <script src="extras-config.js?v=13" defer></script>
  <script src="storybook-extras.js?v=12" defer></script>
  <script src="script.js?v=12" defer></script>
</head>
<body>
  <main class="storybook-app" id="app">
    <header class="masthead">
      <div class="masthead-name"><span aria-hidden="true">✦</span><span>the pages between us</span></div>
      <div class="masthead-right">
        <button class="music-toggle" id="music-toggle" type="button" aria-pressed="false" aria-label="Play gentle background music"><span aria-hidden="true">♫</span><span id="music-label">Music off</span></button>
        <div class="masthead-date">FOR <span data-recipient>Ash</span> · 07 NOV</div>
      </div>
    </header>

    <section class="book-area" aria-label="Birthday story">
      <span class="book-backdrop backdrop-a" aria-hidden="true">✳</span>
      <span class="book-backdrop backdrop-b" aria-hidden="true">❀</span>
      <div class="book-shell" id="book" aria-label="Interactive page-turning book"></div>
    </section>
    <div class="book-progress" aria-live="polite">
      <div class="progress-label" id="progress-label">Tap the cover to begin</div>
      <div class="progress-dots" id="progress-dots" aria-hidden="true"></div>
    </div>
    <p class="book-instructions" id="book-instructions">Tap left or right to turn the page. Double-tap the center to finish the typing.</p>
  </main>

  <template id="page-cover">
    <div class="cover-outside">
      <span class="cover-inner-border">
        <span class="cover-flourish cover-top" aria-hidden="true">✧ · ❀ · ✧</span>
        <span class="cover-middle">
          <span class="cover-kicker">A BIRTHDAY STORY</span>
          <span class="cover-small-line"></span>
          <span class="cover-title">the pages<br><i>between</i><br>us</span>
          <span class="cover-small-line"></span>
          <span class="cover-for">FOR <span>MS. ILARIA</span> · NOVEMBER SEVENTH</span>
        </span>
        <span class="cover-flourish cover-bottom" aria-hidden="true">❦</span>
      </span>
      <span class="cover-click-hint">tap to open the story ✧</span>
    </div>
  </template>
  <template id="page-intro">
    <div class="page-content page-intro">
      <div class="folio-label">A LETTER IN THE FORM OF A BOOK</div>
      <div class="intro-illustration" aria-hidden="true"><span>✿</span><span>❦</span><span>✧</span></div>
      <div class="intro-text">
        <p class="page-eyebrow">a little birthday surprise</p>
        <h1>Some stories<br>are better <em>shared.</em></h1>
        <p>Miladyyy, happy birthday!! :D You survived my old birthday videos, suspicious screenshots, and every Rickroll I managed to sneak in. I figured Ms. Ilaria deserved something different this year.</p>
        <p class="intro-dedication">No video this time. I made you an actual book. This somehow seemed like a perfectly normal idea. HAHAHA. Take your time with it, alright?</p>
      </div>
      <div class="intro-bottom">FOR ASH · WITH APPRECIATION AND AN UNREASONABLE AMOUNT OF EFFORT</div>
    </div>
  </template>

  <template id="page-origin">
    <div class="page-content page-origin">
      <div class="folio-label">CHAPTER ONE · THE BEGINNING</div>
      <h2>It started with<br><em>a story.</em></h2>
      <div class="wattpad-note" aria-hidden="true">
        <span class="wattpad-mark">W</span>
        <span class="wattpad-lines"><i></i><i></i><i></i></span>
        <span class="wattpad-note-caption">a rather unexpected beginning ✧</span>
      </div>
      <p>Of all the places we could've met, it had to be Wattpad. We went there for stories, then somehow ended up talking about games, books, and things that probably shouldn't be retrieved from the archives. XD</p>
      <p>Wattpad lost its private messages, and quite a lot of our older conversations disappeared with them. But we made it from there to Discord, and after all these years, I'm still calling you milady. I like that part of the story best.</p>
      <p class="page-aside">Some Wattpad conversations are best left to history. You know the ones.</p>
    </div>
  </template>

  <template id="page-notes">
    <div class="page-content page-notes">
      <div class="folio-label">CHAPTER TWO · FAMILIAR CHAOS</div>
      <h2>Little things<br><em>we'd recognize.</em></h2>
      <p class="page-lead">A tiny museum of things that make perfect sense to us and almost no sense to anyone else. There may be a few recent Genshin incidents in here.</p>
      <div class="memory-grid" data-memory-grid aria-label="Four interactive inside jokes"></div>
      <p class="page-aside">The archives may be incomplete, but the nonsense is well preserved.</p>
    </div>
  </template>


  <template id="page-scratch">
    <div class="page-content page-scratch">
      <div class="folio-label">CHAPTER TWO · A FEW HIDDEN THINGS</div>
      <h2>Little secrets<br><em>worth finding.</em></h2>
      <p class="page-lead">I could have written these on an ordinary birthday card, but where is the fun in that? Three little things, hidden just for you.</p>
      <div class="scratch-grid" data-scratch-grid aria-label="Scratchable hidden messages"></div>
      <p class="page-aside">No incriminating screenshots were harmed in the making of this page.</p>
    </div>
  </template>

  <template id="page-distance">
    <div class="page-content page-distance">
      <div class="folio-label">CHAPTER THREE · ACROSS THE MILES</div>
      <h2>Different clocks.<br><em>Same conversation.</em></h2>
      <div class="sky-postcard" aria-hidden="true"><span class="sky-sun"></span><span class="sky-moon"></span><span class="sky-spark a">✦</span><span class="sky-spark b">✧</span><span class="sky-spark c">✦</span><span class="sky-text">same sky, different hours</span></div>
      <div class="time-cards">
        <div class="time-card"><small>PHILIPPINES</small><strong data-clock="ph">--:--</strong></div>
        <span class="time-connection" aria-hidden="true">↔</span>
        <div class="time-card"><small data-friend-location>ITALY</small><strong data-clock="it">--:--</strong></div>
      </div>
      <p>You asked if I'd eaten dinner back in 2022. In 2026, you're still reminding me to sleep when I've clearly lost track of the hour. I really should start listening. T_T Your studies, my work, and the time between the Philippines and Italy don't make conversations easy to schedule. Still, when we get talking again, there's usually another story to tell or another Genshin theory for you to explain to me.</p>
      <p class="page-aside">One day our sleep schedules might make sense. I wouldn't bet on it.</p>
    </div>
  </template>

  <template id="page-letter">
    <div class="page-content page-letter">
      <div class="folio-label">CHAPTER FOUR · A FEW WORDS</div>
      <h2>Something<br><em>for you to read.</em></h2>
      <p class="page-lead">A few words I wanted to write properly this time. Read them whenever you feel like it.</p>
      <div class="letter-world" data-letter-world>
        <!-- zspxx-inspired pocket layers; the paper stays INSIDE the pocket until extracted. -->
        <div class="letter-envelope" aria-hidden="true">
          <div class="env-back"></div>
          <div class="env-flap"></div>
          <div class="env-stamp">♡</div>
        </div>
        <div class="letter-sheet" data-letter-sheet role="button" tabindex="-1" aria-label="Tap letter to return it to the envelope" aria-hidden="true">
          <div class="sheet-inner">
            <small>November 7, <span data-year>2026</span></small>
            <h3>Dear <span data-recipient>Ash</span>,</h3>
            <div data-letter-paragraphs class="letter-prose"></div>
            <p class="letter-signoff">From your resident munchkin,<br><strong data-sender>Woof</strong> ♡</p>
          </div>
        </div>
        <div class="env-front" aria-hidden="true"></div>
        <button class="letter-tap-zone" data-letter-toggle type="button" aria-label="Open the birthday letter"><span class="sr-only">Open the envelope</span></button>
      </div>
      <p class="page-aside letter-aside">Once it's open, tap the paper again to put it back.</p>
    </div>
  </template>


  <template id="page-openwhen">
    <div class="page-content page-openwhen">
      <div class="folio-label">CHAPTER FOUR · KEEP FOR A RAINY DAY</div>
      <h2>For whenever<br><em>you need a note.</em></h2>
      <p class="page-lead">Four tiny envelopes for four different kinds of days. They are yours to open whenever you need one.</p>
      <div class="openwhen-list" data-openwhen-list aria-label="Open when letters"></div>
    </div>
  </template>

  <template id="page-birthday">
    <div class="page-content page-birthday">
      <div class="folio-label">THE EPILOGUE · NOVEMBER SEVENTH</div>
      <h2>The most<br><em>important chapter.</em></h2>
      <p class="page-lead">Happy birthday, Ms. Ilaria! Discord still hasn't figured out how to deliver cake, so I made one you can actually interact with. Make a wish, milady.</p>
      <div class="cake-scene" data-cake-scene role="img" aria-label="Birthday cake with three flickering candles">
        <div class="cake-shimmer" aria-hidden="true">✧ <span>✦</span> ✧</div>
        <div class="cake-candles" aria-hidden="true"><span class="candle"><i class="flame"></i><i class="smoke"></i></span><span class="candle"><i class="flame"></i><i class="smoke"></i></span><span class="candle"><i class="flame"></i><i class="smoke"></i></span></div>
        <div class="cake-icing"></div><div class="cake-base"><span>make a wish ♡</span></div><div class="cake-plate"></div>
        <div class="cake-confetti" data-confetti aria-hidden="true"></div>
      </div>
      <button class="wish-button" type="button" data-wish-button>Make a wish &amp; blow out the candles ✳</button>
      <p class="birthday-wish" data-birthday-wish aria-live="polite" hidden></p>
      <div class="mystery-note"><span>One more completely trustworthy gift</span><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">open the mystery ↗</a><small>Some traditions can't be abandoned.</small></div>
    </div>
  </template>

      <div class="folio-label">ONE MORE SURPRISE · A SMALL GARDEN</div>
      <h2>Some things<br><em>keep growing.</em></h2>
      <p class="page-lead">A little garden for someone who's made it through another year. I like the thought of giving you something that takes its time to grow, especially when life is constantly asking us to rush. I hope you get more good days, good books, and unexpected little things that make you smile.</p>

      <button class="bloom-replay" type="button" data-bloom-replay>Let them bloom again ✧</button>

  <template id="page-ending">
    <div class="page-content page-ending">
      <span class="ending-ornament" aria-hidden="true">✧ ❀ ✧</span>
      <div class="ending-core"><p class="page-eyebrow">a small final note</p><h2>To be<br><em>continued.</em></h2><p>And that's the end of this little book. Thank you for every strange conversation, every birthday surprise we've exchanged, and all the moments that survived even after the old messages disappeared. Happy birthday again, Ms. Ilaria. I hope we'll have a lot more to laugh about when the next birthday comes around.</p><p class="ending-signature">from your resident munchkin, <span data-sender>Woof</span> ♡</p></div>
      <div class="ending-action"><button type="button" data-restart>Read from the beginning ↺</button></div>
    </div>
  </template>

  <template id="page-blank">
    <div class="page-content page-blank"><span class="blank-ornament">❦</span><span>fin.</span></div>
  </template>
  <template id="page-back-cover">
    <div class="cover-outside cover-rear">
      <span class="cover-inner-border"><span class="cover-flourish">✧ ❀ ✧</span><span class="rear-message">for the stories<br>still to come ♡</span><span class="cover-flourish">❦</span></span>
    </div>
  </template>

</html>
